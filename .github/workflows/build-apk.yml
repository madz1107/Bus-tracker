name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Passenger APK
        uses: actions/upload-artifact@v4
        with:
          name: Nellai72-Passenger-APK
          path: android/app/build/outputs/apk/passenger/debug/app-passenger-debug.apk
          retention-days: 14

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: Nellai72-Driver-APK
          path: android/app/build/outputs/apk/driver/debug/app-driver-debug.apk
          retention-days: 14

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Nellai72-Admin-APK
          path: android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          retention-days: 14

      - name: Upload All 3 APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nellai72-All-3-APKs-Bundle
          path: android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14
